name: build-base-image

# EQ7 / o2-prebuilt-base-image: build the prebuilt base image (OS packages +
# Python deps) and publish it to GHCR. The application Dockerfile pulls this as
# its FROM base, so app builds skip apt entirely and pip only installs deltas.
#
# base-as-cache: this rebuild is a pure optimisation. The app Dockerfile still
# re-runs `pip install -r requirements.txt`, so a delayed/missed rebuild only
# slows the next app build — it never ships a prod image missing dependencies.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "Dockerfile.base"
      - ".github/workflows/build-base-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          # Owner lowercased: GHCR repository paths must be lowercase.
          tags: ghcr.io/sweetcowcow/podcastrag-base:base
          # Persist BuildKit layer cache across runs via GHA cache so repeat
          # base rebuilds reuse the apt + pip layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
