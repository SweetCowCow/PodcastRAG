name: eval tests

# Runs the RAG-eval unit tests + dataset schema check on every PR/push that
# touches the eval module or its tests. Pure offline tests — no network, no
# secrets needed.
#
# A real-eval-baseline workflow (running run.py against staging) is intentionally
# left out of this file: it needs AIHUB / e2e-login secrets and a long-lived
# staging URL, neither of which is set up yet. Add later as a separate
# workflow when secrets are wired.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/eval/**"
      - "backend/tests/test_eval_*.py"
      - "backend/tests/test_golden_set_dataset.py"
      - "backend/requirements.txt"
      - ".github/workflows/eval-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/eval/**"
      - "backend/tests/test_eval_*.py"
      - "backend/tests/test_golden_set_dataset.py"
      - "backend/requirements.txt"
      - ".github/workflows/eval-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install minimal deps
        # Only what the listed eval tests import at module-load:
        # pytest + jsonschema (dataset schema test) + httpx (mocked in runner test).
        # Skipping `requirements.txt` install (DeepEval, FastAPI, SQLAlchemy)
        # because none of these tests touch the app/ stack — that's covered by
        # the full backend-tests workflow.
        run: pip install pytest pytest-asyncio jsonschema httpx

      - name: Run eval unit tests
        # Note: test_admin_eval_runs is excluded — it imports app.main and is
        # covered by backend-tests.yml (with postgres + redis services).
        # --noconftest skips tests/conftest.py, which auto-imports sqlalchemy
        # for the auth fixtures we don't use here.
        run: |
          python -m pytest --noconftest \
            tests/test_eval_metrics.py \
            tests/test_eval_runner.py \
            tests/test_golden_set_dataset.py \
            -v
